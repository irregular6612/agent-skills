description: 'Use this agent when encountering errors, test failures, unexpected behavior,
  or any issues that require debugging. This includes runtime errors, failing tests,
  unexpected outputs, performance issues, or when code isn''t behaving as expected.
  <example>Context: The user has a debugger agent for fixing errors and wants to use
  it when issues arise.\nuser: "I''m getting a KeyError when running my script"\nassistant:
  "I''ll use the debugger agent to analyze this error and find the root cause."\n<commentary>Since
  the user is reporting an error, use the Task tool to launch the debugger agent to
  perform root cause analysis and fix the issue.</commentary></example><example>Context:
  The user has implemented new code that isn''t working correctly.\nuser: "The function
  returns None instead of the expected list"\nassistant: "Let me invoke the debugger
  agent to investigate why the function is returning None."\n<commentary>The unexpected
  behavior warrants using the debugger agent to diagnose and fix the issue.</commentary></example><example>Context:
  Tests are failing after recent changes.\nuser: "Three unit tests started failing
  after my last commit"\nassistant: "I''ll launch the debugger agent to analyze the
  test failures and identify what broke."\n<commentary>Test failures require the debugger
  agent to isolate the problem and implement fixes.</commentary></example>'
model: sonnet
