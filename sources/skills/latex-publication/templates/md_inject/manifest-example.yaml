# md-inject.yaml — optional overrides for the latex-korean-setup skill's
# Part 2 (MD→TeX injection). The skill works WITHOUT this file: markers
# in main.tex are the primary source of truth. Use this file only when
# you want to override defaults per-injection.
#
# Place this file at your project root (or pass --manifest <path> to
# md_inject.sh).

version: 1

# Path to the prepared LaTeX template, relative to project root.
# Omit to auto-detect: main.tex, then docs/manuscripts/pre-print-template/main.tex.
target: docs/manuscripts/pre-print-template/main.tex

# Root directory for resolving MD sources referenced by markers.
md_root: docs

# Cache directory for fragments + plan.json + meta.json. Should be
# .gitignored (the gitignore-snippet template handles this).
build_cache: .build/md_inject

defaults:
  # Citation backend that main.tex actually uses. Controls whether the
  # converter rewrites bare \cite{} → \citep{} and whether the auditor
  # treats \cite{} as a warning.
  cite_style: natbib     # natbib | biblatex

  # Strip the MD H1 heading when injecting into a marker that already
  # sits inside a pre-existing \section{}/\subsection{} block (most
  # common case).
  h1_strip: true

  # Any MD-wide extra flags to pass to pandoc. The converter already
  # sets: --from gfm+tex_math_dollars+raw_tex+fenced_code_attributes+pipe_tables
  #       --to latex --no-highlight --wrap=none --listings
  # You do NOT need to repeat those here.
  pandoc_extra_flags: []

# Per-marker overrides. Key is the marker id (the string after
# `% MD-INJECT:` in main.tex).
injections:
  # Example 1: a subsection where the MD already has a proper H1 that
  # should become an \subsubsection.
  # design/v3/06_measurement_framework:
  #   h1_strip: false
  #   pandoc_extra_flags:
  #     - "--top-level-division=subsection"
  #     - "--shift-heading-level-by=2"

  # Example 2: a section with unusually wide stat tables — force tabularx.
  # design/v3/11_evaluation_scoring:
  #   pandoc_extra_flags:
  #     - "-V"
  #     - "tables=tabularx"

# Marker ids to skip even if present in main.tex (for staged rollouts).
skip_markers: []
