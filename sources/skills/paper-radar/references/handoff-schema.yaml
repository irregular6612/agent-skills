# Paper Radar — Handoff 계약
#
# paper-radar 카드에서 다음 스킬로 넘길 때 쓰는 기계 판독 페이로드.
# 사용자가 "3 드릴" / "3 공부" 를 입력했을 때 이 구조를 채워서 넘긴다.
#
# 원칙
# - 여기 없는 필드를 지어내지 않는다. 모르면 "N/A".
# - radar 카드는 초록 수준이다. source_coverage 를 속이지 않는다.
# - 보류/제외는 handoff를 만들지 않는다. state/feedback만 갱신한다.

schema: paper-radar-handoff
version: 1

# ---------------------------------------------------------------
# 필수 필드
# ---------------------------------------------------------------
required:
  - radar_id
  - source_url
  - vault_root
  - candidate_rationale
  - selected_action

fields:

  radar_id:
    type: string
    pattern: "^R-[0-9a-f]{8}$"
    desc: "정규화 키(arXiv-ID > DOI > 정규화 URL > 정규화 제목)의 sha1 앞 8자리. 실행 간 안정적."

  title:
    type: string
    desc: "원문 제목 그대로. 번역하지 않는다."

  arxiv_id:
    type: string
    desc: "버전 접미사 없는 arXiv ID. 없으면 'N/A'. 형식을 추정해 만들지 않는다."
    default: "N/A"

  doi:
    type: string
    desc: "소문자 DOI, 'https://doi.org/' prefix 제거. 없으면 'N/A'."
    default: "N/A"

  source_url:
    type: string
    desc: "실제로 확인한 URL. 이것이 없으면 handoff 자체를 만들지 않는다."

  vault_root:
    type: string
    desc: "Phase 0에서 확정한 절대 경로."

  vault_root_rule:
    type: integer
    enum: [1, 2, 3, 4, 5]
    desc: "vault_root를 어느 규칙으로 정했는지 (1 사용자지정 / 2 PAPER_RADAR_VAULT / 3 알려진 vault / 4 CWD / 5 질문)."

  candidate_rationale:
    type: object
    desc: "왜 이 후보가 올라왔는가. 다음 스킬이 사용자의 목적을 이해하는 데 쓴다."
    fields:
      track: "예: mech-interp (+ alt-theory)"
      pool: "frontier | curriculum | graph"
      why_you: "이 사용자에게 추천한 이유 (원문 그대로)"
      learning_payoff: "읽고 나면 무엇을 할 수 있게 되는가"
      score_total: "랭킹 총점"
      score_breakdown: "8축 점수 (n/a 포함)"

  wiki_relation:
    type: string
    enum: [new, existing, update, follow-up, radar-seen]
    desc: "Phase 2 dedup 결과."

  existing_note_path:
    type: string
    desc: "wiki_relation이 existing/update/follow-up일 때 vault_root 상대 경로. 없으면 'N/A'."
    default: "N/A"

  source_coverage:
    type: string
    enum: [abstract-only, section-extract, fulltext, unknown]
    default: abstract-only
    desc: >-
      radar 카드의 기본값은 abstract-only 다.
      전문을 실제로 열어보지 않았으면 이 값을 올리지 않는다.
      다음 스킬은 이 값을 신뢰하고 동작하므로 여기서 속이면 하류 전체가 오염된다.

  affiliation:
    type: object
    fields:
      lab: "확인된 lab 이름 또는 'N/A'"
      confidence: "high | medium | low | unverified"
      attribution_source: "실제로 확인한 URL 또는 '논문 메타'"
    desc: "제목 키워드만으로 추정하지 않는다. 근거 없으면 confidence: unverified."

  mapping_depth:
    type: string
    enum: [metaphorical, mathematical, representational, functional, empirically-tested, "N/A"]
    desc: "brain-analogy 트랙일 때 필수."

  selected_action:
    type: string
    enum: [드릴, 공부, 보류, 제외]

  exclusion_reason:
    type: string
    desc: "selected_action이 '제외'일 때 사용자가 말한 이유를 원문 그대로. 요약·해석하지 않는다."

# ---------------------------------------------------------------
# 액션별 라우팅
# ---------------------------------------------------------------
routing:

  드릴:
    target: "/paper-driller"
    command: "/paper-driller {arxiv_id 또는 source_url} --mode preread"
    contract:
      - "paper-radar는 canonical paper 노트를 직접 쓰지 않는다."
      - "driller가 노트를 만든 뒤 그 경로를 state.json 의 해당 radar_id 아래 note_path 로 기록한다."
      - "wiki_relation이 existing/update면 driller에 update-existing 의도를 함께 전달한다."

  공부:
    target: "/paper-understand"
    precondition: "canonical preread 노트가 존재해야 한다."
    command_when_note_exists: "/paper-understand {existing_note_path}"
    command_when_note_missing:
      - "1. /paper-driller {arxiv_id 또는 source_url} --mode preread"
      - "2. /paper-understand {새로 만들어진 노트 경로}"
    contract:
      - "radar 카드(abstract-only)를 전문 소스로 넘기지 않는다."
      - "preread 노트 없이 튜터링을 시작하지 않는다."

  보류:
    target: null
    effects:
      - "state.json: 항목 status = parked, parked_at 기록"
      - "feedback.yaml: 약한 부정 신호 1건"
      - "파일 생성 없음. canonical 노트 수정 없음."

  제외:
    target: null
    effects:
      - "state.json: 항목 status = excluded"
      - "feedback.yaml: exclusion_reason 을 원문 그대로 기록"
      - "이유에 나타난 키워드는 config.yaml 의 blocked_keywords 후보로만 제안한다 (자동 추가 금지)"
      - "파일 생성 없음. canonical 노트 수정 없음."

# ---------------------------------------------------------------
# 예시
# ---------------------------------------------------------------
example:
  radar_id: "R-a1b2c3d4"
  title: "Example Title As Printed"
  arxiv_id: "2607.01234"
  doi: "N/A"
  source_url: "https://arxiv.org/abs/2607.01234"
  vault_root: "/Users/…/obsidian-notes"
  vault_root_rule: 3
  candidate_rationale:
    track: "mech-interp"
    pool: "frontier"
    why_you: "SAE feature absorption 관련 기존 노트 2편을 잇는다"
    learning_payoff: "feature splitting과 absorption을 구분해서 설명할 수 있게 된다"
    score_total: 78.4
    score_breakdown: {interest_fit: 5, pedagogical: 4, novelty: 3, evidence: "n/a",
                      bridge: 3, availability: 3, freshness: 5, risk: 1}
  wiki_relation: "new"
  existing_note_path: "N/A"
  source_coverage: "abstract-only"
  affiliation: {lab: "N/A", confidence: "unverified", attribution_source: "N/A"}
  mapping_depth: "N/A"
  selected_action: "드릴"
